[package]
name = "agent-rig"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[features]
default = []
gemini = ["dep:geologia"]
ollama = ["dep:ollama-rs"]
deepseek = ["dep:cetologia"]
full = ["gemini", "ollama", "deepseek"]

[dependencies]
ollama-rs = { git = "https://github.com/andreban/ollama-rs", optional = true }
geologia = { git = "https://github.com/andreban/geologia", optional = true }
cetologia = { git = "https://github.com/andreban/cetologia", optional = true }
async-trait = "0.1"
futures-util = "0.3"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
async-stream = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
schemars = "1"

[dev-dependencies]
schemars = "1.2.1"
dotenvy = "0.15"
reqwest = { version = "0.13", features = ["json"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[[test]]
name = "integration_gemini"
required-features = ["gemini"]

[[test]]
name = "integration_ollama"
required-features = ["ollama"]

[[test]]
name = "integration_deepseek"
required-features = ["deepseek"]

